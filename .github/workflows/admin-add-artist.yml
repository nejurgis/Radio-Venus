name: Admin Add Artist

# Backend for the password-gated "add musician" web tool. Dispatched by the
# admin Worker (see admin/), never intended to be run manually — but you can
# run `mode: lookup` by hand from the Actions tab to test the pipeline
# without a callback (results just print to the log).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'lookup = resolve a link into artist + similar-artist previews. commit = merge confirmed entries into seed + rebuild + push.'
        type: choice
        options: [lookup, commit]
        required: true
      job_id:
        description: 'Job id the Worker will poll for (only needed if callback_url is set)'
        required: false
        default: ''
      callback_url:
        description: 'Admin Worker origin to POST results back to, e.g. https://radio-venus-admin.example.workers.dev (leave blank to just print to the log)'
        required: false
        default: ''
      url:
        description: '[lookup] YouTube or Spotify link to resolve'
        required: false
        default: ''
      payload:
        description: '[commit] JSON array of confirmed artist entries'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  lookup:
    if: inputs.mode == 'lookup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Resolve artist + similar artists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          CALLBACK_SECRET: ${{ secrets.ADMIN_CALLBACK_SECRET }}
        run: |
          ARGS=(--url="${{ inputs.url }}")
          if [ -n "${{ inputs.callback_url }}" ]; then
            ARGS+=(--job="${{ inputs.job_id }}" --callback="${{ inputs.callback_url }}" --secret="$CALLBACK_SECRET")
          fi
          node scripts/admin-resolve.mjs "${ARGS[@]}"

  commit:
    if: inputs.mode == 'commit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install

      - name: Merge confirmed entries into seed
        run: |
          cat > /tmp/payload.json <<'EOF'
          ${{ inputs.payload }}
          EOF
          node scripts/admin-commit.mjs --payload-file=/tmp/payload.json

      - name: Rebuild DB
        run: node scripts/build-db.mjs

      - name: Commit + push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/seed-musicians.json public/data/musicians.json
          if git diff --cached --quiet; then
            echo "sha=none" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat: add artist via admin tool [bot]"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Report result
        if: always() && inputs.callback_url != ''
        env:
          CALLBACK_SECRET: ${{ secrets.ADMIN_CALLBACK_SECRET }}
        run: |
          STATUS="done"
          if [ "${{ job.status }}" != "success" ]; then STATUS="error"; fi
          curl -sf -X POST "${{ inputs.callback_url }}/api/jobs/${{ inputs.job_id }}/result" \
            -H "Authorization: Bearer $CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$STATUS\",\"sha\":\"${{ steps.commit.outputs.sha }}\"}" || true
