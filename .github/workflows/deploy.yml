name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]  # Trigger whenever you push to master
  # Pushes made by workflows (admin add-artist, playlist import) don't trigger
  # `push` runs, so those workflows dispatch this one after they push.
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time; a newer one waits instead of racing on gh-pages.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies 🔧
        run: npm ci

      - name: Build Project 🏗️
        run: npm run build
        # Make sure your package.json has a "build" script!

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder where your build output goes (usually 'dist' or 'build')
          branch: gh-pages # The branch to deploy to